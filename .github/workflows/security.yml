
name: SecureScan Security Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run SecureScan
        uses: rahulkumar4814/Secure_Scanner@main
        with:
          target: "."
          fail-on: high

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secure-scan-report
          path: security-report.json
          if-no-files-found: warn
